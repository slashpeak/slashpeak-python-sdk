name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  schedule:
    # Weekly, against the newest google-cloud-bigquery.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        bigquery: ["3.17.*", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.bigquery }}" = "latest" ]; then
            pip install -e '.[test]' --upgrade google-cloud-bigquery
          else
            pip install -e '.[test]' "google-cloud-bigquery==${{ matrix.bigquery }}"
          fi
      - name: Test
        run: python -m pytest -W ignore::FutureWarning
