name: python-release

# Tag `python-v0.1.0` to publish that version. PyPI trusted publishing (OIDC): no token is stored.
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import re;print(re.search(r'\"(.+)\"', open('src/slashpeak/bigquery/_version.py').read()).group(1))")
          test "python-v${version}" = "${GITHUB_REF_NAME}"
      - name: Test
        run: |
          pip install -e '.[test]'
          python -m pytest -W ignore::FutureWarning
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
