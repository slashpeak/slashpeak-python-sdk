[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slashpeak"
dynamic = ["version"]
description = "SlashPeak Job Router: run each warehouse query where it costs less (BigQuery today)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "SlashPeak", email = "slashpeak@proton.me" }]
keywords = ["bigquery", "cost", "reservations", "finops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "requests>=2.25,<3",
  "urllib3>=1.26",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.0,<4"]
test = ["pytest>=7", "google-cloud-bigquery>=3.0,<4"]

[project.urls]
Homepage = "https://slashpeak.com"
Source = "https://github.com/slashpeak/slashpeak-python-sdk"

[project.scripts]
slashpeak = "slashpeak.cli:main"

[tool.hatch.version]
path = "src/slashpeak/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "spec", "README.md", "LICENSE", "SECURITY.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/slashpeak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
