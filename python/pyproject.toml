[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slashpeak-bigquery"
dynamic = ["version"]
description = "SlashPeak Job Router for google-cloud-bigquery: run each query where it costs less."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "SlashPeak", email = "slashpeak@proton.me" }]
keywords = ["bigquery", "cost", "reservations", "finops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "google-cloud-bigquery>=3.0,<4",
  "requests>=2.25,<3",
  "urllib3>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://slashpeak.com"
Source = "https://github.com/slashpeak/slashpeak-sdks"

[project.scripts]
slashpeak = "slashpeak.bigquery.cli:main"

[tool.hatch.version]
path = "src/slashpeak/bigquery/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slashpeak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
